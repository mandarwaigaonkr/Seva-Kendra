# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Free plan. Deploy steps and the values to paste are in DEPLOY.md.
services:
  # API: Express + MongoDB Atlas. Free web services sleep after 15 idle minutes and take up to
  # a minute to wake; the frontend shows "Starting the server…" and retries meanwhile.
  - type: web
    name: seva-kendra-api
    runtime: node
    plan: free
    region: singapore # closest Render region to Kolkata
    rootDir: sevaKendra-backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: MONGO_URL # Atlas connection string (asked for when the Blueprint is created)
        sync: false
      - key: JWT_SECRET
        generateValue: true # long random value made by Render; never commit one
      - key: FRONTEND_URL # the static site's URL, e.g. https://seva-kendra.onrender.com
        sync: false

  # Website: built once, served from Render's CDN. Never sleeps, so the page always opens
  # instantly even while the API is waking.
  - type: web
    name: seva-kendra
    runtime: static
    rootDir: Frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_URL # the API's URL + /api/v1, e.g. https://seva-kendra-api.onrender.com/api/v1
        sync: false
    headers:
      # File names under /assets change on every build, so browsers may keep them for a year.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The page itself is always re-checked, so a new deploy shows up on the next visit.
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      # Single-page app: every path loads index.html and the router takes over.
      - type: rewrite
        source: /*
        destination: /index.html
